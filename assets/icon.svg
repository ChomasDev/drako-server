<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2a25"/>
      <stop offset="1" stop-color="#0d1311"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- horns, curling outward -->
    <path d="M330 380 C286 340 250 290 236 222 C290 246 344 288 392 336 Z" fill="#a7f3d0" stroke="#a7f3d0" stroke-width="22" stroke-linejoin="round"/>
    <path d="M694 380 C738 340 774 290 788 222 C734 246 680 288 632 336 Z" fill="#a7f3d0" stroke="#a7f3d0" stroke-width="22" stroke-linejoin="round"/>

    <!-- soft crest -->
    <path d="M462 300 L486 248 L510 300 Z" fill="#a7f3d0" stroke="#a7f3d0" stroke-width="16" stroke-linejoin="round"/>
    <path d="M514 300 L538 248 L562 300 Z" fill="#a7f3d0" stroke="#a7f3d0" stroke-width="16" stroke-linejoin="round" transform="translate(-0 0)"/>

    <!-- head: wide, soft, a little narrower at the snout -->
    <path d="M512 290 C702 290 800 400 800 548 C800 702 672 800 512 800 C352 800 224 702 224 548 C224 400 322 290 512 290 Z" fill="#0a0d0c"/>

    <!-- eyes -->
    <ellipse cx="398" cy="540" rx="72" ry="84" fill="#a7f3d0"/>
    <ellipse cx="626" cy="540" rx="72" ry="84" fill="#a7f3d0"/>
    <ellipse cx="404" cy="548" rx="40" ry="62" fill="#0a0d0c"/>
    <ellipse cx="620" cy="548" rx="40" ry="62" fill="#0a0d0c"/>
    <circle cx="384" cy="514" r="16" fill="#f0fdf4"/>
    <circle cx="604" cy="514" r="16" fill="#f0fdf4"/>

    <!-- nostrils and smile -->
    <circle cx="488" cy="672" r="7" fill="#2a3a33"/>
    <circle cx="536" cy="672" r="7" fill="#2a3a33"/>
    <path d="M452 712 Q512 748 572 712" fill="none" stroke="#a7f3d0" stroke-width="12" stroke-linecap="round"/>
  </g>
</svg>
