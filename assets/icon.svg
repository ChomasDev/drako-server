<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f3d2e"/>
      <stop offset="1" stop-color="#05140f"/>
    </linearGradient>
    <clipPath id="tile"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>

  <g clip-path="url(#tile)">
    <!-- tail -->
    <path d="M600 800 C700 812 742 770 724 722" fill="none" stroke="#0b0f0d" stroke-width="40" stroke-linecap="round"/>
    <path d="M724 722 C700 700 704 664 736 652 C752 680 760 702 724 722 Z" fill="#10b981"/>

    <!-- wings -->
    <path d="M330 600 C262 590 220 540 222 470 C256 492 290 498 318 494 C312 530 318 560 340 576 Z" fill="#1f7a5a"/>
    <path d="M694 600 C762 590 804 540 802 470 C768 492 734 498 706 494 C712 530 706 560 684 576 Z" fill="#1f7a5a"/>

    <!-- horns, curling outward -->
    <path d="M392 330 C360 300 330 268 318 222 C352 236 392 262 432 300 Z" fill="#10b981" stroke="#10b981" stroke-width="16" stroke-linejoin="round"/>
    <path d="M632 330 C664 300 694 268 706 222 C672 236 632 262 592 300 Z" fill="#10b981" stroke="#10b981" stroke-width="16" stroke-linejoin="round"/>

    <!-- soft crest -->
    <path d="M446 296 L466 250 L486 296 Z" fill="#10b981" stroke="#10b981" stroke-width="14" stroke-linejoin="round"/>
    <path d="M490 290 L512 236 L534 290 Z" fill="#10b981" stroke="#10b981" stroke-width="14" stroke-linejoin="round"/>
    <path d="M538 296 L558 250 L578 296 Z" fill="#10b981" stroke="#10b981" stroke-width="14" stroke-linejoin="round"/>

    <!-- body, feet, head -->
    <ellipse cx="512" cy="740" rx="128" ry="104" fill="#0b0f0d"/>
    <ellipse cx="452" cy="836" rx="44" ry="26" fill="#0b0f0d"/>
    <ellipse cx="572" cy="836" rx="44" ry="26" fill="#0b0f0d"/>
    <circle cx="512" cy="490" r="215" fill="#0b0f0d"/>

    <!-- eyes: soft upright ovals, pupils centred and looking slightly in -->
    <ellipse cx="434" cy="512" rx="56" ry="66" fill="#34d399"/>
    <ellipse cx="590" cy="512" rx="56" ry="66" fill="#34d399"/>
    <ellipse cx="440" cy="518" rx="38" ry="50" fill="#05140f"/>
    <ellipse cx="584" cy="518" rx="38" ry="50" fill="#05140f"/>
    <circle cx="424" cy="496" r="14" fill="#ecfdf5"/>
    <circle cx="568" cy="496" r="14" fill="#ecfdf5"/>
    <circle cx="452" cy="540" r="6" fill="#ecfdf5"/>
    <circle cx="596" cy="540" r="6" fill="#ecfdf5"/>

    <!-- blush -->
    <ellipse cx="374" cy="604" rx="34" ry="18" fill="#34d399" opacity="0.28"/>
    <ellipse cx="650" cy="604" rx="34" ry="18" fill="#34d399" opacity="0.28"/>

    <!-- smile -->
    <path d="M490 612 Q501 624 512 614 Q523 624 534 612" fill="none" stroke="#34d399" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
